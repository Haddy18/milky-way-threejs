name: deploy

# Despliegue automático del sitio estático al VPS cada vez que cambia su
# contenido (incluidos los binarios de data/, el catálogo estelar). La clave
# SSH y los datos del servidor viven solo en los secrets: el workflow escribe
# un .env temporal (como el .env local gitignored) y ejecuta el MISMO
# scripts/deploy.sh que en local — misma ruta, mismas verificaciones
# (intercambio atómico + health check de la URL pública).
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "vendor/**"
      - "data/**"
      - "scripts/deploy.sh"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Un despliegue no puede cancelar a otro a medias (el intercambio es atómico,
# pero preferimos cola a dos subidas entrelazadas).
concurrency:
  group: deploy-milky-way
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar .env y clave SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          SITE_URL: ${{ secrets.SITE_URL }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          for v in VPS_HOST VPS_USER VPS_SSH_PORT VPS_DEPLOY_PATH VPS_SSH_KEY; do
            [ -n "${!v:-}" ] || { echo "::error:: falta el secret $v"; exit 1; }
          done
          # .env como el local (gitignored aquí; en CI se genera y ya).
          {
            echo "VPS_HOST=$VPS_HOST"
            echo "VPS_USER=$VPS_USER"
            echo "VPS_SSH_PORT=$VPS_SSH_PORT"
            echo "VPS_DEPLOY_PATH=$VPS_DEPLOY_PATH"
            echo "SITE_URL=$SITE_URL"
          } > .env
          # La clave privada de despliegue (pública en authorized_keys del VPS).
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key

      - name: Desplegar
        run: |
          export VPS_SSH_KEY="$HOME/.ssh/vps_deploy_key"
          bash scripts/deploy.sh
